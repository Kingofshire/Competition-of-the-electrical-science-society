<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیدربورد</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="user-page">
<div class="page-logos" aria-label="لوگوهای انجمن و دانشگاه">
  <img src="/society-mark.png" alt="لوگوی انجمن علمی">
  <img src="/uni-mark.png" alt="لوگوی دانشگاه">
</div>
  <img src="/champ-peek.png" class="champ-mascot" id="champMascot" alt="قهرمان مسابقه">
<div class="scene-bg" aria-hidden="true">
  <div class="scene-bg__image"></div>
  <div class="scene-bg__spotlight"></div>
  <div class="scene-bg__overlay"></div>
</div>
</div>
<div class="wrap">
  <header class="top">
    <h1>لیدربورد</h1>
    <nav>
      <a href="/quiz.html">سوالات</a>
      <button class="tick-toggle" id="tickToggle" type="button" aria-pressed="false" title="صدای تیک">🔊 صدا</button>
      <button id="logoutBtn">خروج</button>
    </nav>
  </header>

  <div class="card" id="content">در حال بارگذاری...</div>
</div>

<script src="/audio-blob.js"></script>
<script src="/tick-sound.js"></script>
<script>
document.getElementById('logoutBtn').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/index.html';
};

let myUsername = null;
let timerHandle = null;
let refreshHandle = null;
let contestAudioTimer = null;
let contestAudioDeadline = null;
const tickSound = window.quizTickSound;
const tickToggle = document.getElementById('tickToggle');

function updateTickToggle() {
  const muted = tickSound.isMuted();
  tickToggle.textContent = muted ? '🔇 بی‌صدا' : '🔊 صدا';
  tickToggle.setAttribute('aria-pressed', String(muted));
  tickToggle.title = muted ? 'روشن کردن صدای تیک' : 'خاموش کردن صدای تیک';
}

tickToggle.onclick = () => {
  tickSound.toggleMuted();
  updateTickToggle();
};
document.addEventListener('tick-sound-state', updateTickToggle);
window.addEventListener('pagehide', () => tickSound.pause());
window.addEventListener('pageshow', event => {
  if (event.persisted) void syncContestTick(); // Sync contest tick sound on page show
});

async function syncContestTick() {
  try {
    const response = await fetch('/api/questions');
    if (!response.ok) return;
    const data = await response.json();
    if (!data.contest.started || data.contest.expired) {
      tickSound.stop();
      if (contestAudioTimer) clearInterval(contestAudioTimer);
      contestAudioTimer = null;
      contestAudioDeadline = null;
      updateTickToggle();
      return;
    }

    const startTime = new Date(data.contest.startedAt).getTime();
    const endTime = new Date(data.contest.endsAt).getTime();
    if (contestAudioDeadline !== endTime) {
      if (contestAudioTimer) clearInterval(contestAudioTimer);
      contestAudioDeadline = endTime;
      const updateProgress = () => {
        const remaining = Math.max(0, endTime - Date.now());
        tickSound.setProgress(Number.isFinite(startTime) && endTime > startTime ? remaining / (endTime - startTime) : 1);
        if (remaining <= 0) {
          tickSound.stop();
          clearInterval(contestAudioTimer);
          contestAudioTimer = null;
        }
      };
      updateProgress();
      contestAudioTimer = setInterval(updateProgress, 1000);
    }

    tickSound.start();
  const remaining = Math.max(0, endTime - Date.now());
  tickSound.setProgress(Number.isFinite(startTime) && endTime > startTime ? remaining / (endTime - startTime) : 1);
    updateTickToggle();
  } catch (error) {
    // Optional timer audio must not interfere with the leaderboard.
  }
}

function fmtRemaining(ms) {
  if (ms <= 0) return '۰۰:۰۰:۰۰';
  const s = Math.floor(ms / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

async function render() {
  const meRes = await fetch('/api/me').then(r => r.json());
  if (!meRes.username) { window.location.href = '/index.html'; return; }
  myUsername = meRes.username;
  await syncContestTick();

  const data = await fetch('/api/leaderboard').then(r => r.json());
  const content = document.getElementById('content');

  if (data.locked) {
    let countdown = '';
    if (data.endTime) {
      countdown = `<div class="countdown" id="cd"></div>`;
      if (timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(() => {
        const remain = new Date(data.endTime) - new Date();
        const cd = document.getElementById('cd');
        if (cd) cd.textContent = fmtRemaining(remain);
        if (remain <= 0) { clearInterval(timerHandle); render(); }
      }, 1000);
    }
    content.innerHTML = `
      <h2>🔒 لیدربورد قفل است</h2>
      <p class="muted">نتایج پس از پایان مسابقه نمایش داده می‌شود.</p>
      ${countdown}
    `;
    return;
  }

  if (timerHandle) clearInterval(timerHandle);

  const rows = data.entries.map((e, i) => `
    <tr class="${e.username === myUsername ? 'me' : ''}">
      <td class="rank">${i + 1}</td>
      <td>${escapeHtml(e.username)}${e.username === myUsername ? ' (شما)' : ''}</td>
      <td>${e.score}</td>
      <td class="muted">${e.answered}</td>
    </tr>
  `).join('');

  content.innerHTML = `
    <h2>🏆 نتایج نهایی</h2>
    <table>
      <thead><tr><th>رتبه</th><th>نام کاربری</th><th>امتیاز</th><th>پاسخ‌داده</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">هنوز شرکت‌کننده‌ای نیست.</td></tr>'}</tbody>
    </table>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
refreshHandle = setInterval(render, 10000);
</script>
<script src="/scene-parallax.js"></script>
<script src="/publicchamp-mascot.js"></script>
</body>
</html>
